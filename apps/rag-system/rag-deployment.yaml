apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-backend
  namespace: default
  labels:
    app: rag-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-backend
  template:
    metadata:
      labels:
        app: rag-backend
    spec:
      containers:
      - name: backend
        image: rag-backend:v2.0
        imagePullPolicy: IfNotPresent
        env:
        # 基于 K8s 集群 DNS 服务名进行零硬编码通信
        - name: MILVUS_ADDR
          value: "milvus.milvus.svc.cluster.local:19530"
        - name: OLLAMA_URL
          value: "http://ollama-service.ai-services.svc.cluster.local:11434"
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rag-backend-svc
  namespace: default
spec:
  selector:
    app: rag-backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
  namespace: default
  labels:
    app: rag-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-frontend
  template:
    metadata:
      labels:
        app: rag-frontend
    spec:
      containers:
      - name: frontend
        image: rag-frontend:v2.0
        imagePullPolicy: IfNotPresent
        env:
        - name: BACKEND_ADDR
          value: "http://rag-backend-svc.default.svc.cluster.local:8080"
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rag-frontend-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: rag-frontend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
    nodePort: 30088
